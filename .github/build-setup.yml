- name: Read locked ort-sys version
  id: ort
  shell: bash
  run: |
    lock=$(<Cargo.lock)
    lock=${lock//$'\r'/}
    pattern=$'name = "ort-sys"\nversion = "([^"]+)"'
    [[ "$lock" =~ $pattern ]]
    printf 'version=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
- name: Cache verified ONNX Runtime archives
  uses: actions/cache@v4
  with:
    path: ${{ runner.temp }}/ort-archives
    key: ort-archives-${{ runner.os }}-${{ runner.arch }}-${{ steps.ort.outputs.version }}
- name: Prefetch verified ONNX Runtime
  shell: bash
  timeout-minutes: 45
  env:
    ORT_ARCHIVE_DIR: ${{ runner.temp }}/ort-archives
  run: bash scripts/fetch-ort.sh
- name: Fetch and verify pinned OCR models
  run: cargo xtask fetch-models
