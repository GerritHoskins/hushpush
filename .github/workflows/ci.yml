name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust with quality tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked --no-fail-fast
      - uses: actions/cache@v4
        with:
          path: models
          key: ocr-models-${{ hashFiles('xtask/src/fetch.rs', 'crates/hushpush-core/model_pins.rs') }}
      - name: Fetch verified local OCR assets
        run: cargo +stable xtask fetch-models
      - name: Test product OCR with local models
        shell: bash
        env:
          HUSHPUSH_MODELS: ${{ github.workspace }}/models
        run: cargo +stable test --locked --workspace --no-fail-fast -- --ignored
      - name: Lint with embedded OCR models
        run: cargo +stable clippy --locked --all-targets --features bundled-models -- -D warnings
      - name: Test with embedded OCR models and no model override
        run: cargo +stable test --locked --workspace --features bundled-models --no-fail-fast -- --ignored

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v4
        with:
          path: models
          key: ocr-models-${{ hashFiles('xtask/src/fetch.rs', 'crates/hushpush-core/model_pins.rs') }}
      - name: Fetch verified local OCR assets
        run: cargo +stable xtask fetch-models
      - name: Build release CLI
        run: cargo +stable build --release --locked
      - name: Evaluate independent labeled corpus
        env:
          HUSHPUSH_MODELS: ${{ github.workspace }}/models
        run: cargo +stable xtask eval --split dev --ci

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: stable
