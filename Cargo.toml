[workspace]
members = ["crates/hushpush-core", "crates/hushpush-cli", "xtask"]
exclude = ["spikes", "fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Find likely personal data in logs and screenshots before pushing"
repository = "https://github.com/GerritHoskins/hushpush"
homepage = "https://github.com/GerritHoskins/hushpush"
readme = "README.md"
keywords = ["privacy", "pii", "ocr", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
hushpush-core = { path = "crates/hushpush-core" }
regex = "1"
walkdir = "2"
thiserror = "2"
tempfile = "3"

[profile.dist]
inherits = "release"
lto = "thin"
