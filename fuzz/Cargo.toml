[package]
name = "hushpush-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "=0.4.13"
hushpush-core = { path = "../crates/hushpush-core", features = ["fuzzing"] }

[[bin]]
name = "classify_decode_detect"
path = "fuzz_targets/classify_decode_detect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_decode"
path = "fuzz_targets/image_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "git_parsers"
path = "fuzz_targets/git_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redact_text"
path = "fuzz_targets/redact_text.rs"
test = false
doc = false
bench = false
